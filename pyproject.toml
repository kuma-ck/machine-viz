[project]
name = "machine-viz"
version = "0.1.0"
description = "機器情報可視化Webアプリケーション"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.6",
    "python-dotenv>=1.0.0",
    "pydantic-settings>=2.0.0",
    # Database
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "aiosqlite>=0.19.0",
    "greenlet>=3.0.0",
    # Authentication
    "bcrypt>=4.0.0",
    "itsdangerous>=2.1.0",
    "numpy>=2.4.1",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.29.0"]
sqlserver = ["aioodbc>=0.5.0"]

